# Serveur web de production : une seule origine pour tout Voyara.
# - /        → site client Next.js (SSR/SEO, conteneur `client`)
# - /admin/  → app admin Vite (fichiers statiques)
# - /api/    → gateway (préfixe /api retiré — même convention que les proxys dev)
# - /static/ → gateway (avatars servis par auth-service)
# Même origine → session (localStorage) partagée entre site et admin.

server {
    listen 80;
    server_name _;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
    }

    # Tout le reste → Next.js (SSR)
    location / {
        proxy_pass http://client:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
